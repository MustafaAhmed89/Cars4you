# Supabase local dev config for Cars4you.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "cars4you"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.listing-photos]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.dealer-docs]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["cars4you://", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

# Phone OTP is the primary sign-in for the Indian market.
[auth.sms]
enable_signup = true
enable_confirmations = true

# Use the built-in test OTP locally (no real SMS provider needed for dev).
[auth.sms.test_otp]
"919999999999" = "123456"

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
